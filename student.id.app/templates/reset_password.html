<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更 - オンライン学生証</title>
</head>
<body>
    <h2>パスワード変更</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    
    {% if success %}
        <p style="color: green; font-weight: bold;">{{ success }}</p>
    {% endif %}
    
    <form method="POST">
        <label for="student_number">学籍番号:</label><br>
        <input type="text" id="student_number" name="student_number" required><br><br>
        
        <label for="new_password">新しいパスワード:</label><br>
        <input type="password" id="new_password" name="new_password" required><br><br>
        
        <input type="submit" value="パスワードを変更する">
    </form>
    <br>
    <a href="{{ url_for('login') }}">ログイン画面に戻る</a>
</body>
</html>

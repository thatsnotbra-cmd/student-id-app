<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生証ログイン</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .login-box { display: inline-block; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { margin: 10px 0; padding: 8px; width: 200px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>オンライン学生証</h2>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div>
                <input type="text" name="user_id" placeholder="ユーザーID" required>
            </div>
            <div>
                <input type="password" name="password" placeholder="パスワード" required>
            </div>
            <button type="submit">ログイン</button>
        </form>
    </div>
<br>
<a href="{{ url_for('signup') }}">サインアップ</a>
<br>
<a href="{{ url_for('reset_password') }}">パスワードを忘れた方・変更はこちら</a>
</body>
</html>

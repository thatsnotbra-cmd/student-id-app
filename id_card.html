<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル学生証</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .card { 
            display: inline-block; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        img { max-width: 100%; height: auto; margin-top: 20px; }
        .logout { margin-top: 20px; display: inline-block; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

    <div class="card">
        <h2>デジタル学生証</h2>
        <p><strong>氏名:</strong> 山田 太郎</p>
        <p><strong>学籍番号:</strong> student01</p>
        
        <img src="{{ url_for('static', filename='qr_code.png') }}" alt="認証用QRコード">
        
        <p>スキャンしてチェックイン</p>
    </div>

    <br>
    <a href="/" class="logout">ログアウトして戻る</a>

</body>
</html>
